<!DOCTYPE html>

<html lang="es">
	
<head>
	
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi TV Online - Canales en Vivo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="icon.ico">
    
</head>

<body>

    <div class="tv-container">
    
		<!-- Columna Izquierda: Tele, Info, Aviso y Controles -->
        <div class="tv-left-column">
            <div id="tv-player"></div>

            <div class="tv-info">
                <h2 id="channel-name">Cargando canal...</h2>
                <p id="channel-desc">Esperá un momento por favor.</p>
            </div>

            <!-- Aviso sobre anuncios -->
            <div class="tv-notice">
                <span>💡 <strong>Tip:</strong> Usá un bloqueador de anuncios (AdBlock) o una cuenta con YouTube Premium para disfrutar la transmisión sin interrupciones.</span>
            </div>
        </div>

        <!-- Columna Derecha: Lista de canales y Botones CH+/CH- abajo -->
        <div class="tv-right-column">
            <ul id="channel-list-container"></ul>

            <div class="controls">
				
                <button id="btn-prev">CH -</button>
                <button id="btn-next">CH +</button>
                <!-- Agregamos la clase channel-btn aquí para unificar el estilo y comportamiento -->
                <button id="btn-fullscreen" class="channel-btn">Pantalla Completa</button>
                <!-- Nuevo botón de Subtítulos -->
                <button id="btn-subtitles" class="channel-btn">Subtítulos (S)</button>
            
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
